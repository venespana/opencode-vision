# Release workflow — publishes @venespana/opencode-vision to npm via
# Trusted Publishing (OIDC). No npm token required.
#
# Trigger: a GitHub Release is published (or a manual workflow_dispatch run).
# Prerequisite: configure a Trusted Publisher on npmjs.com for this package
# pointing to: venespana/opencode-vision, workflow "release.yml".
# Provenance is generated automatically by trusted publishing.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # REQUIRED for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Set version from release tag
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "Setting package version to $VERSION (from tag $TAG)"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: npm publish

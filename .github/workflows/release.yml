# Release workflow — publishes @venespana/opencode-vision to npm via
# Trusted Publishing (OIDC). No npm token required.
#
# Trigger: every push to main (or a manual workflow_dispatch run).
# The published version is the one in package.json. If that version already
# exists on the registry, the job exits early — so a release happens exactly
# when a merge to main carries a package.json version bump.
# Prerequisite: configure a Trusted Publisher on npmjs.com for this package
# pointing to: venespana/opencode-vision, workflow "release.yml".
# Provenance is generated automatically by trusted publishing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # REQUIRED for OIDC trusted publishing

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve package version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@venespana/opencode-vision@$VERSION" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION is already on npm — nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION is new — will publish."
          fi

      - name: Setup pnpm
        if: steps.version.outputs.publish == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: pnpm build

      - name: Test
        if: steps.version.outputs.publish == 'true'
        run: pnpm test

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: npm publish

name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the sections below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: input
    id: opencode-version
    attributes:
      label: OpenCode version
      placeholder: "e.g. 1.18.8"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model used
      placeholder: "e.g. zai-coding-plan/glm-5.2"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Plugin config
      description: Your opencode-vision config (redact any secrets). Paste as JSON/JSONC.
      render: jsonc
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug log
      description: Output from the debug log file (enable `debug: true` and set `logFile`).
      render: shell
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
